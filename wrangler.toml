name = "tereflow"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Pinned because wrangler guessed wrong. With an OAuth login it resolved an
# account id that is not the one the login belongs to, and every remote command
# failed with "Authentication error [code: 10000]" while `wrangler whoami`
# cheerfully reported d1 (write). The error names authentication, so the hour
# goes on tokens and scopes rather than on the account being addressed.
account_id = "7d45a565f13b85b72350bca2cc8c4d09"

# NOTE ON CHANGING database_id
#
# The local miniflare file is named after this id, so editing it does not point
# the dev server at a different database: it silently creates an empty one and
# every request fails with "no such table: entities". The previous data is still
# on disk under the old id's filename, not lost, just no longer addressed.
#
# If local suddenly has no tables after a config change, that is why. Either put
# the id back, or re-run `npm run db:migrate:local && npm run seed:local` to
# populate the new file.

# Serve the built React SPA straight from the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# No [triggers] block on purpose.
#
# The ingest and analysis pipeline runs on a machine you control and pushes
# finished results to /api/admin/ingest/*. See local/pipeline.ts and the
# "Running the pipeline" section of the README.
#
# Workers cap subrequests per invocation, which limited a cloud run to two
# countries per fire. Locally the whole registry finishes in one pass, and the
# heavy work costs nothing on hardware you already own.

# Local dev works with these placeholders. Before the first remote deploy run:
#   npm run db:create      -> paste the real database_id here
#   wrangler kv namespace create CACHE  -> paste the real id here
[[d1_databases]]
binding = "DB"
database_name = "tereflow"
database_id = "2ffaffa8-6b49-46f0-91cb-12caa524e286"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "c695850919d14808be6049cf75a0ccf1"

[vars]
APP_NAME = "Tereflow"
# Comma-separated emails allowed into /admin. Set per environment with
# `wrangler secret put` or a per-environment [vars] block. Deliberately empty
# here: a real address in version control is somebody's personal data sitting
# in every clone and fork of this repository.
ADMIN_EMAILS = ""

# Granting premium to whoever calls /api/auth/tier is a development convenience
# and nothing else. Declared here, false, so the deployed configuration always
# carries an explicit safe value rather than relying on the setting being
# absent. local/.dev.vars overrides it for local work, and .dev.vars is never
# deployed. Turning this on in a real environment takes a deliberate act, which
# is the point.
ALLOW_DEV_TIER_SWITCH = "false"

# Secrets (set with: wrangler secret put NAME)
#   ADMIN_TOKEN        - shared secret for the admin console
#   COMTRADE_API_KEY   - optional, raises UN Comtrade rate limit
#   CENSUS_API_KEY     - optional, US Census international trade API
#   SESSION_SECRET     - HMAC key for user sessions (Phase 2)
