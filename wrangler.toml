name = "tereflow"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Serve the built React SPA straight from the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# No [triggers] block on purpose.
#
# The ingest and analysis pipeline runs on a machine you control and pushes
# finished results to /api/admin/ingest/*. See local/pipeline.ts and the
# "Running the pipeline" section of the README.
#
# Workers cap subrequests per invocation, which limited a cloud run to two
# countries per fire. Locally the whole registry finishes in one pass, and the
# heavy work costs nothing on hardware you already own.

# Local dev works with these placeholders. Before the first remote deploy run:
#   npm run db:create      -> paste the real database_id here
#   wrangler kv namespace create CACHE  -> paste the real id here
[[d1_databases]]
binding = "DB"
database_name = "tereflow"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

[vars]
APP_NAME = "Tereflow"
# Comma-separated emails allowed into /admin. Override per environment.
ADMIN_EMAILS = "danieltekyi@microsoft.com"

# Secrets (set with: wrangler secret put NAME)
#   ADMIN_TOKEN        - shared secret for the admin console
#   COMTRADE_API_KEY   - optional, raises UN Comtrade rate limit
#   CENSUS_API_KEY     - optional, US Census international trade API
#   SESSION_SECRET     - HMAC key for user sessions (Phase 2)
